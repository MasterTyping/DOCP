[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-rag-mcp"
version = "0.2.0"
description = "Local PDF and Markdown search MCP server over stdio"
readme = "README.md"
# pymupdf 2.1 ships wheels for 3.11+ only.
requires-python = ">=3.11"
# mcp 2.x renamed FastMCP to MCPServer, so stay on 1.x
dependencies = [
    "mcp[cli]>=1.30,<2",
    "pymupdf==2.1",
    "markdown-it-py>=3",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.scripts]
pdf-rag = "run:main"
pdf-rag-server = "server:main"
pdf-rag-add = "run:add_client"

[tool.setuptools]
# Sources live in src/, but the project root must stay here so `uvx --from git+<repo>` resolves.
package-dir = {"" = "src"}
py-modules = ["run", "server", "doc_export"]
