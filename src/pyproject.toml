[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-rag-mcp"
version = "0.1.0"
description = "Local PDF search MCP server over stdio"
readme = "README.md"
requires-python = ">=3.10"
# mcp 2.x renamed FastMCP to MCPServer, so stay on 1.x
dependencies = ["mcp[cli]>=1.30,<2", "pymupdf==2.1"]

[project.scripts]
pdf-rag = "run:main"
pdf-rag-server = "server:main"
pdf-rag-add = "run:add_client"

[tool.setuptools]
py-modules = ["run", "server"]
